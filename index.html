<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f3d2e">
<title>Stichfest — Doppelkopf</title>
<style>
:root{
  --felt-1:#0d3c2c;
  --felt-2:#0a2e21;
  --felt-line: rgba(212,175,90,0.18);
  --gold:#d4af5a;
  --gold-bright:#eccd8a;
  --cream:#f2ead9;
  --ink:#0b1f16;
  --re:#c94f4f;
  --kontra:#4f7fc9;
  --panel: rgba(10,30,22,0.72);
  --panel-line: rgba(212,175,90,0.28);
  --radius: 14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{height:100%;}
body{
  margin:0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  color: var(--cream);
  background:
    radial-gradient(1200px 800px at 20% -10%, rgba(255,255,255,0.05), transparent 60%),
    repeating-linear-gradient(45deg, var(--felt-1) 0 2px, var(--felt-2) 2px 4px),
    var(--felt-1);
  background-attachment: fixed;
  min-height:100vh;
  padding-bottom: 90px;
}
h1,h2,h3{
  font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--gold-bright);
  margin: 0 0 8px 0;
}
.topbar{
  position: sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 16px 10px 16px;
  background: linear-gradient(180deg, rgba(6,20,15,0.95), rgba(6,20,15,0.75) 70%, transparent);
  backdrop-filter: blur(6px);
}
.brand{display:flex; align-items:baseline; gap:8px;}
.brand .suits{font-size:14px; letter-spacing:3px; color: var(--gold); opacity:0.8;}
.brand h1{font-size:20px; margin:0;}
.iconbtn{
  background: none; border: 1px solid var(--panel-line); color: var(--gold-bright);
  border-radius: 10px; padding: 8px 10px; font-size: 15px;
}
.iconbtn.active{ background: rgba(212,175,90,0.35); color:#22160a; border-color: var(--gold); }
main{ padding: 6px 16px 24px 16px; max-width: 560px; margin: 0 auto; }
.card{
  background: var(--panel);
  border: 1px solid var(--panel-line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 14px;
}
.muted{ color: rgba(242,234,217,0.6); font-size: 13px; line-height:1.5; }
.row{ display:flex; gap:10px; }
.col{ flex:1; }
label{ display:block; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color: var(--gold); margin: 10px 0 4px; }
input[type=text], input[type=number], select{
  width:100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--panel-line);
  background: rgba(0,0,0,0.25); color: var(--cream); font-size:16px;
}
button{
  font-family: inherit; cursor:pointer; border:none; border-radius: 12px;
  padding: 13px 16px; font-size:15px; font-weight:600; letter-spacing:0.01em;
}
.btn-primary{ background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#22160a; width:100%; }
.btn-secondary{ background: rgba(212,175,90,0.12); color: var(--gold-bright); border:1px solid var(--panel-line); width:100%; }
.btn-danger{ background: rgba(201,79,79,0.18); color:#f3b8b8; border:1px solid rgba(201,79,79,0.4); width:100%; }
.btn-ghost{ background: transparent; color: var(--gold-bright); border:1px dashed var(--panel-line); width:100%; }
.btn-row{ display:flex; gap:10px; margin-top:10px; }
.btn-row > *{ flex:1; }
.stack > * + *{ margin-top:10px; }

.pill{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:12px; font-weight:700; letter-spacing:0.03em; }
.pill-re{ background: rgba(201,79,79,0.22); color:#f3b8b8; }
.pill-kontra{ background: rgba(79,127,201,0.22); color:#bcd3f5; }
.pill-gold{ background: rgba(212,175,90,0.22); color: var(--gold-bright); }

.card-chip{
  display:inline-flex; align-items:center; justify-content:center;
  width:52px; height:70px; border-radius:8px;
  background: linear-gradient(180deg, #fdf8ec, #efe4c6);
  color:#1b1204; font-weight:800; font-size:17px; flex-direction:column; gap:2px;
  box-shadow: 0 3px 0 rgba(0,0,0,0.35), 0 6px 10px rgba(0,0,0,0.35);
  border: 1px solid rgba(0,0,0,0.15);
}
.card-chip.red{ color:#a01f1f; }
.card-chip .rank{ font-size:16px; line-height:1; }
.card-chip .suit{ font-size:19px; line-height:1; }
.card-chip.empty{ background: rgba(255,255,255,0.05); box-shadow:none; border:1px dashed var(--panel-line); }

.trick-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin: 14px 0; }
.trick-slot{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.trick-slot .name{ font-size:11px; color: rgba(242,234,217,0.7); max-width:60px; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.trick-slot.leader .name{ color: var(--gold-bright); font-weight:700; }

.calib-grid{ display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; }
.calib-cell{
  border:1px solid var(--panel-line); border-radius:10px; padding:8px 6px; text-align:center;
  background: rgba(0,0,0,0.18); font-size:12px; position:relative;
}
.calib-cell .count{ font-size:11px; color: rgba(242,234,217,0.6); margin-top:4px;}
.calib-cell.done{ border-color: rgba(120,200,140,0.6); }
.calib-cell.partial{ border-color: rgba(212,175,90,0.6); }

.score-table{ width:100%; border-collapse: collapse; font-size:14px; }
.score-table th, .score-table td{ padding:8px 6px; text-align:center; border-bottom: 1px solid var(--panel-line); }
.score-table th{ color: var(--gold); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.04em;}
.score-table td.name-col, .score-table th.name-col{ text-align:left; }
.pos{ color:#9fe3ac; } .neg{ color:#f3b8b8; }

.toast{
  position: fixed; left:50%; bottom: 100px; transform: translateX(-50%);
  background: rgba(20,50,38,0.96); border:1px solid var(--panel-line); color:var(--cream);
  padding: 12px 18px; border-radius: 12px; font-size:14px; max-width: 90%; text-align:center;
  z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.tabbar{
  position: fixed; bottom:0; left:0; right:0; z-index:30;
  display:flex; background: rgba(6,18,13,0.95); border-top:1px solid var(--panel-line);
  backdrop-filter: blur(8px);
}
.tabbar button{
  flex:1; background:none; border-radius:0; color: rgba(242,234,217,0.55);
  padding: 10px 4px 14px; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px;
}
.tabbar button.active{ color: var(--gold-bright); }
.tabbar .ic{ font-size:18px; }

.ansage-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
.ansage-btn{ background: rgba(212,175,90,0.1); border:1px solid var(--panel-line); color: var(--cream); font-size:13px; padding:10px; }
.ansage-btn.active{ background: rgba(212,175,90,0.35); color:#22160a; font-weight:800;}

.hidden{ display:none !important; }
.center{ text-align:center; }
hr.sep{ border:none; border-top:1px solid var(--panel-line); margin:14px 0; }
.log-item{ font-size:13px; padding:6px 0; border-bottom: 1px dashed var(--panel-line); }
.log-item:last-child{ border-bottom:none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>Stichfest</h1>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="iconbtn" id="btnWakeLock" title="Bildschirm wach halten">☀︎</button>
    <button class="iconbtn" id="btnSettings">⚙︎</button>
  </div>
</div>

<main id="app"></main>

<div class="tabbar" id="tabbar">
  <button data-view="play"><span class="ic">🂡</span>Spiel</button>
  <button data-view="scores"><span class="ic">🧮</span>Punkte</button>
  <button data-view="calibrate"><span class="ic">📡</span>Karten</button>
  <button data-view="setup"><span class="ic">👥</span>Spieler</button>
</div>

<div id="toastHost"></div>

<script>
/* ============================= DATEN / KONSTANTEN ============================= */
const SUITS = ['Kreuz','Pik','Herz','Karo'];
const RANKS = ['Neun','Zehn','Bube','Dame','Koenig','Ass'];
const RANK_POINTS = {Neun:0,Zehn:10,Bube:2,Dame:3,Koenig:4,Ass:11};
const RANK_LABEL = {Neun:'9',Zehn:'10',Bube:'B',Dame:'D',Koenig:'K',Ass:'A'};
const SUIT_SYMBOL = {Kreuz:'♣',Pik:'♠',Herz:'♥',Karo:'♦'};
const SUIT_RED = {Herz:true, Karo:true};

const ALL_CARD_IDS = [];
SUITS.forEach(s => RANKS.forEach(r => ALL_CARD_IDS.push(s+'-'+r)));

function suitOf(cardId){ return cardId.split('-')[0]; }
function rankOf(cardId){ return cardId.split('-')[1]; }
function pointsOf(cardId){ return RANK_POINTS[rankOf(cardId)]; }

// Normale Trumpfreihenfolge, beste zuerst (Karo ist Trumpf-Farbe)
const TRUMP_ORDER = [
  'Kreuz-Dame','Pik-Dame','Herz-Dame','Karo-Dame',
  'Kreuz-Bube','Pik-Bube','Herz-Bube','Karo-Bube',
  'Karo-Ass','Karo-Zehn','Karo-Koenig','Karo-Neun'
];
const FEHL_ORDER = ['Ass','Zehn','Koenig','Neun']; // für Nicht-Trumpf-Farben (Dame/Bube sind immer Trumpf)

/* ============================= STATE ============================= */
const STORAGE_KEY = 'stichfest_state_v1';

function defaultState(){
  return {
    players: ['Spieler 1','Spieler 2','Spieler 3','Spieler 4'],
    calibration: {}, // serial -> cardId
    settings: {
      dulleLastTrick:false, // "2. Dulle sticht die 1. (im letzten Stich)"
      fuchsBonus:true, karlchenBonus:true, doppelkopfBonus:true,
      soloMultiplier: 3, bockEnabled:true
    },
    bockWindows: [], // [{fromRoundNo, toRoundNo}] – Runden-Nummern, die durch einen Bock-Auslöser verdoppelt werden
    scoreHistory: [], // { roundNo, label, values:[+-,...], augen:{re,kontra}, timestamp }
    totals: [0,0,0,0],
    nextVorhand: 0,
    currentRound: null,
    view: 'setup',
    setupDone: false,
    wakeLockEnabled: false
  };
}

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function toast(msg, ms=2600){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.remove(); }, ms);
}

/* ============================= BILDSCHIRM WACH HALTEN ============================= */
let wakeLock = null;
const wakeLockSupported = (typeof navigator !== 'undefined' && 'wakeLock' in navigator);

async function acquireWakeLock(){
  if(!wakeLockSupported) return;
  try{
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
  }catch(e){
    wakeLock = null;
  }
}
function releaseWakeLock(){
  if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock = null; }
}
async function setWakeLockEnabled(on){
  state.wakeLockEnabled = on;
  save();
  if(on){ await acquireWakeLock(); if(!wakeLock) toast('Wach-Halten wird von diesem Browser nicht unterstützt.'); }
  else { releaseWakeLock(); }
  render();
}
if(typeof document !== 'undefined'){
  document.addEventListener('visibilitychange', async ()=>{
    if(!document.hidden && state.wakeLockEnabled && !wakeLock){
      await acquireWakeLock();
    }
  });
}

/* ============================= KALIBRIERUNG ============================= */
function calibCountFor(cardId){
  return Object.values(state.calibration).filter(v=>v===cardId).length;
}
function calibTotalDone(){
  return Object.keys(state.calibration).length;
}
function serialToCard(serial){
  if(state.calibration[serial]) return state.calibration[serial];
  // Direkt-Namenskonvention "<Farbe>-<Rang>-<1|2>" (z.B. "Kreuz-Dame-1") — für Karten,
  // die per fest benannter Automatisierung direkt die passende URL öffnen; hier ist
  // keine Kalibrierung nötig, da die Kartenidentität schon im Namen steckt.
  const m = serial.match(/^(.+)-[12]$/);
  if(m && ALL_CARD_IDS.includes(m[1])) return m[1];
  return null;
}

function assignSerial(serial, cardId){
  state.calibration[serial] = cardId;
  save();
}

/* ============================= RUNDE ============================= */
function startNewRound(type, opts){
  const r = {
    type, // 'normal' | 'hochzeit' | 'solo' | 'armut'
    soloPlayerIndex: opts.soloPlayerIndex ?? null,
    soloArt: opts.soloArt || null,
    hochzeitPlayerIndex: opts.hochzeitPlayerIndex ?? null,
    hochzeitPartnerIndex: null,
    armutPlayerIndex: opts.armutPlayerIndex ?? null,
    armutPartnerIndex: opts.armutPartnerIndex ?? null, // null + type 'armut' + niemandAufgenommen=true => Armut-Spieler allein
    armutNiemandAufgenommen: !!opts.armutNiemandAufgenommen,
    schweinchenActive: !!opts.schweinchenActive,
    vorhandIndex: state.nextVorhand,
    trickLeader: state.nextVorhand,
    trickIndex: 0, // 0..11
    currentTrick: [], // {playerIndex, cardId, serial, order}
    completedTricks: [], // {winnerIndex, cards:[{playerIndex,cardId}], augen}
    announcements: [], // {side:'Re'|'Kontra'|'Solo'|'Gegner', type:'re'|'kontra'|'unter90'|'unter60'|'unter30'|'schwarz', atTrick}
    playOrderCounter: 0,
    usedSerials: [], // Seriennummern, die in dieser Runde bereits gescannt wurden (verhindert doppeltes Zählen derselben physischen Karte)
    awaitingAnnouncements: false // true, sobald alle 12 Stiche gespielt sind, bis "Abrechnen" gedrückt wird
  };
  state.currentRound = r;
  save();
}

function remainingCardCounts(round){
  const used = {};
  round.completedTricks.forEach(t=>t.cards.forEach(c=>{ used[c.cardId]=(used[c.cardId]||0)+1; }));
  round.currentTrick.forEach(c=>{ used[c.cardId]=(used[c.cardId]||0)+1; });
  const remaining = {};
  ALL_CARD_IDS.forEach(id=>{ remaining[id] = 2 - (used[id]||0); });
  return remaining;
}

function isTrumpCard(cardId, schweinchenActive){
  if(schweinchenActive && cardId==='Karo-Ass') return -1;
  const idx = TRUMP_ORDER.indexOf(cardId);
  if(idx!==-1) return idx;
  return null;
}

function determineTrickWinner(cards, ctx){
  ctx = ctx || {};
  const schweinchenActive = !!ctx.schweinchenActive;
  // Sonderregel "2. Dulle sticht die 1. (im letzten Stich)": nur im 12. Stich,
  // nur wenn beide Herz-Zehn in diesem Stich aufeinandertreffen. Die später
  // gespielte Dulle sticht dann alles außer einem angesagten Schweinchen.
  if(ctx.dulleLastTrick && ctx.isLastTrick){
    const dullen = cards.filter(c=>c.cardId==='Herz-Zehn');
    if(dullen.length===2){
      if(schweinchenActive){
        const schweinchenCards = cards.filter(c=>c.cardId==='Karo-Ass');
        if(schweinchenCards.length>0){
          schweinchenCards.sort((a,b)=>a.order-b.order);
          return schweinchenCards[0].playerIndex;
        }
      }
      const later = dullen.reduce((a,b)=> b.order>a.order ? b : a);
      return later.playerIndex;
    }
  }
  const withRank = cards.map(c=>({...c, tIdx: isTrumpCard(c.cardId, schweinchenActive)}));
  const trumps = withRank.filter(c=>c.tIdx!==null);
  let pool;
  if(trumps.length>0){
    const bestIdx = Math.min(...trumps.map(c=>c.tIdx));
    pool = trumps.filter(c=>c.tIdx===bestIdx);
  } else {
    const ledSuit = suitOf(cards[0].cardId);
    const suitCards = withRank.filter(c=>suitOf(c.cardId)===ledSuit);
    const rankIdx = c => FEHL_ORDER.indexOf(rankOf(c.cardId));
    const bestRank = Math.min(...suitCards.map(rankIdx));
    pool = suitCards.filter(c=>rankIdx(c)===bestRank);
  }
  if(pool.length===1) return pool[0].playerIndex;
  pool.sort((a,b)=> a.order-b.order); // gleichwertige Karten: zuerst gespielte sticht
  return pool[0].playerIndex;
}

function addCardToRound(cardId, serial){
  const r = state.currentRound;
  if(!r) return {ok:false, msg:'Keine laufende Runde.'};
  if(r.completedTricks.length>=12) return {ok:false, msg:'Runde ist bereits vollständig — bitte erst abrechnen.'};
  if(serial && r.usedSerials.includes(serial)){
    return {ok:false, msg:'Diese Karte wurde in dieser Runde schon gescannt.', duplicate:true};
  }
  const rem = remainingCardCounts(r);
  if((rem[cardId]||0) <= 0) return {ok:false, msg:'Beide Exemplare dieser Karte wurden schon gespielt.'};
  const playerIndex = (r.trickLeader + r.currentTrick.length) % 4;
  if(serial) r.usedSerials.push(serial);
  r.currentTrick.push({playerIndex, cardId, serial: serial||null, order: r.playOrderCounter++});
  let closedTrick = null;
  if(r.currentTrick.length===4){
    const isLastTrick = r.trickIndex===11;
    const winner = determineTrickWinner(r.currentTrick, {
      schweinchenActive: r.schweinchenActive,
      dulleLastTrick: state.settings.dulleLastTrick,
      isLastTrick
    });
    const augen = r.currentTrick.reduce((s,c)=>s+pointsOf(c.cardId),0);
    closedTrick = { winnerIndex: winner, cards: r.currentTrick.map(c=>({playerIndex:c.playerIndex, cardId:c.cardId})), augen };
    r.completedTricks.push(closedTrick);
    r.currentTrick = [];
    r.trickLeader = winner;
    r.trickIndex++;
    if(r.trickIndex>=12) r.awaitingAnnouncements = true;
  }
  save();
  return {ok:true, closedTrick};
}

// Verarbeitet eine ganze Runde auf einmal: Liste von Seriennummern in Spielreihenfolge.
// Unbekannte Seriennummern werden übersprungen und gesammelt zurückgegeben (zur Nachkalibrierung).
function addBulkSerials(serials){
  const unresolved = [];
  const duplicates = [];
  const rejected = [];
  serials.forEach(serial=>{
    if(!serial) return;
    const cardId = serialToCard(serial);
    if(!cardId){ unresolved.push(serial); return; }
    const res = addCardToRound(cardId, serial);
    if(!res.ok){
      if(res.duplicate) duplicates.push(serial); else rejected.push({serial, msg:res.msg});
    }
  });
  return {unresolved, duplicates, rejected};
}

function undoLastAction(){
  const r = state.currentRound;
  if(!r) return;
  if(r.currentTrick.length>0){
    r.currentTrick.pop();
  } else if(r.completedTricks.length>0){
    const last = r.completedTricks.pop();
    r.trickIndex--;
    r.trickLeader = r.trickIndex===0 ? r.vorhandIndex : r.completedTricks[r.completedTricks.length-1].winnerIndex;
    r.currentTrick = last.cards.map((c,i)=>({playerIndex:c.playerIndex, cardId:c.cardId, serial:null, order:0}));
  }
  save();
}

function addAnnouncement(side, type){
  const r = state.currentRound;
  if(!r) return;
  const existing = r.announcements.find(a=>a.side===side && a.type===type);
  if(existing){
    r.announcements = r.announcements.filter(a=>!(a.side===side && a.type===type));
  } else {
    r.announcements.push({side, type, atTrick: r.trickIndex});
  }
  save();
}

/* ============================= AUSWERTUNG ============================= */
function resolveTeams(round){
  // liefert { teamOf: {0:'Re',1:'Kontra',...}, isSoloLike: bool, loneIndex: int|null, label: string }
  if(round.type==='solo'){
    const teamOf = {};
    [0,1,2,3].forEach(i=> teamOf[i] = (i===round.soloPlayerIndex ? 'Solo' : 'Gegner'));
    return {teamOf, isSoloLike:true, loneIndex: round.soloPlayerIndex, label: (round.soloArt||'Solo')};
  }
  if(round.type==='hochzeit'){
    if(round.hochzeitPartnerIndex===null || round.hochzeitPartnerIndex===undefined){
      const teamOf = {};
      [0,1,2,3].forEach(i=> teamOf[i] = (i===round.hochzeitPlayerIndex ? 'Solo' : 'Gegner'));
      return {teamOf, isSoloLike:true, loneIndex: round.hochzeitPlayerIndex, label:'Stille Hochzeit'};
    }
    const teamOf = {};
    [0,1,2,3].forEach(i=> teamOf[i] = (i===round.hochzeitPlayerIndex || i===round.hochzeitPartnerIndex) ? 'Re' : 'Kontra');
    return {teamOf, isSoloLike:false, loneIndex:null, label:'Hochzeit'};
  }
  if(round.type==='armut'){
    if(round.armutNiemandAufgenommen || round.armutPartnerIndex===null || round.armutPartnerIndex===undefined){
      const teamOf = {};
      [0,1,2,3].forEach(i=> teamOf[i] = (i===round.armutPlayerIndex ? 'Solo' : 'Gegner'));
      return {teamOf, isSoloLike:true, loneIndex: round.armutPlayerIndex, label:'Armut (niemand aufgenommen)'};
    }
    // Armut-Spieler + aufnehmender Spieler bilden automatisch die Re-Partei, unabhängig von den Kreuz-Damen
    const teamOf = {};
    [0,1,2,3].forEach(i=> teamOf[i] = (i===round.armutPlayerIndex || i===round.armutPartnerIndex) ? 'Re' : 'Kontra');
    return {teamOf, isSoloLike:false, loneIndex:null, label:'Armut'};
  }
  // normal: wer spielt Kreuz-Dame(n)?
  const holders = new Set();
  round.completedTricks.forEach(t=>t.cards.forEach(c=>{ if(c.cardId==='Kreuz-Dame') holders.add(c.playerIndex); }));
  round.currentTrick.forEach(c=>{ if(c.cardId==='Kreuz-Dame') holders.add(c.playerIndex); });
  const arr = [...holders];
  if(arr.length===0){
    const teamOf = {}; [0,1,2,3].forEach(i=>teamOf[i]='Unbekannt');
    return {teamOf, isSoloLike:false, loneIndex:null, label:'Normalspiel (Teams noch offen)'};
  }
  if(arr.length===1){
    const teamOf = {};
    [0,1,2,3].forEach(i=> teamOf[i] = (i===arr[0] ? 'Solo' : 'Gegner'));
    return {teamOf, isSoloLike:true, loneIndex: arr[0], label:'Beide Kreuz-Damen bei einem Spieler'};
  }
  const teamOf = {};
  [0,1,2,3].forEach(i=> teamOf[i] = arr.slice(0,2).includes(i) ? 'Re' : 'Kontra');
  return {teamOf, isSoloLike:false, loneIndex:null, label:'Normalspiel'};
}

function computeRoundResult(round){
  const {teamOf, isSoloLike, loneIndex, label} = resolveTeams(round);
  const sideA = isSoloLike ? 'Solo' : 'Re';
  const sideB = isSoloLike ? 'Gegner' : 'Kontra';

  let augenA=0, augenB=0;
  let fuchsA=0, fuchsB=0, doppelkopfA=0, doppelkopfB=0, karlchen=null;

  round.completedTricks.forEach((t,i)=>{
    const winnerSide = teamOf[t.winnerIndex];
    if(winnerSide===sideA) augenA += t.augen; else augenB += t.augen;
    if(t.augen>=40){ if(winnerSide===sideA) doppelkopfA++; else doppelkopfB++; }
    t.cards.forEach(c=>{
      if(c.cardId==='Karo-Ass'){
        const ownerSide = teamOf[c.playerIndex];
        if(ownerSide!==winnerSide){ if(winnerSide===sideA) fuchsA++; else fuchsB++; }
      }
    });
    if(i===round.completedTricks.length-1){
      const winningCard = t.cards.find(c=>c.playerIndex===t.winnerIndex);
      if(winningCard && winningCard.cardId==='Kreuz-Bube') karlchen = winnerSide;
    }
  });

  const totalAugen = augenA+augenB;
  const winnerSide = augenA>=121 ? sideA : sideB; // Kontra/Gegner gewinnt bei Gleichstand oder Mehrheit
  const loserSide = winnerSide===sideA ? sideB : sideA;
  const loserAugen = winnerSide===sideA ? augenB : augenA;

  let basePoints = 1;
  const th90 = loserAugen<90, th60 = loserAugen<60, th30 = loserAugen<30, thSchwarz = loserAugen<=0;
  if(th90) basePoints++;
  if(th60) basePoints++;
  if(th30) basePoints++;
  if(thSchwarz) basePoints++;

  const s = state.settings;
  const sonderA = (s.fuchsBonus?fuchsA:0) + (s.doppelkopfBonus?doppelkopfA:0) + (s.karlchenBonus && karlchen===sideA?1:0);
  const sonderB = (s.fuchsBonus?fuchsB:0) + (s.doppelkopfBonus?doppelkopfB:0) + (s.karlchenBonus && karlchen===sideB?1:0);
  const winnerSonder = winnerSide===sideA ? sonderA : sonderB;
  const loserSonder = winnerSide===sideA ? sonderB : sonderA;

  // Ansage-Boni: erfüllte Schwellen-Ansagen der Gewinnerseite geben +1 (vor Verdopplung)
  let escalationBonus = 0;
  round.announcements.forEach(a=>{
    if(a.side!==winnerSide) return;
    if(a.type==='unter90' && th90) escalationBonus++;
    if(a.type==='unter60' && th60) escalationBonus++;
    if(a.type==='unter30' && th30) escalationBonus++;
    if(a.type==='schwarz' && thSchwarz) escalationBonus++;
  });

  let value = basePoints + (winnerSonder - loserSonder) + escalationBonus;

  let multiplier = 1;
  const announcedSides = new Set(round.announcements.filter(a=>a.type==='re'||a.type==='kontra').map(a=>a.side));
  multiplier *= Math.pow(2, announcedSides.size); // je Seite die "Re"/"Kontra" angesagt hat, verdoppeln
  value = value * multiplier;

  // Bock-Auslöser: verlorene Re-/Kontra-Ansage, oder 120:120 ("gespaltener Arsch")
  const lostAnnouncement = [...announcedSides].some(side=>side!==winnerSide);
  const splitArsch = (augenA===120 && augenB===120);
  const bockTriggered = lostAnnouncement || splitArsch;

  const perPlayer = [0,0,0,0];
  if(isSoloLike){
    const mult = s.soloMultiplier || 3;
    [0,1,2,3].forEach(i=>{
      if(i===loneIndex) perPlayer[i] = (winnerSide==='Solo' ? value*mult : -value*mult);
      else perPlayer[i] = (winnerSide==='Solo' ? -value : value);
    });
  } else {
    [0,1,2,3].forEach(i=>{
      const side = teamOf[i];
      perPlayer[i] = (side===winnerSide ? value : -value);
    });
  }

  return {
    label, teamOf, isSoloLike, sideA, sideB,
    augenA, augenB, totalAugen, winnerSide, loserSide, loserAugen,
    basePoints, sonderA, sonderB, escalationBonus, multiplier, value,
    fuchsA, fuchsB, doppelkopfA, doppelkopfB, karlchen,
    lostAnnouncement, splitArsch, bockTriggered,
    perPlayer
  };
}

function activeBockMultiplier(roundNo){
  if(!state.settings.bockEnabled) return 1;
  const count = (state.bockWindows||[]).filter(w=> roundNo>=w.fromRoundNo && roundNo<=w.toRoundNo).length;
  return Math.pow(2, count);
}

function finishRound(){
  const round = state.currentRound;
  if(!round || round.completedTricks.length<12) return null;
  const result = computeRoundResult(round);
  const roundNo = state.scoreHistory.length+1;

  let bockMultiplier = activeBockMultiplier(roundNo);
  let isDoppelbock = false;
  if(state.settings.bockEnabled && result.bockTriggered){
    if(bockMultiplier>1){
      // Runde war bereits selbst eine Bockrunde und löst erneut eine Bedingung aus -> Doppelbockrunde
      bockMultiplier *= 2;
      isDoppelbock = true;
    }
    state.bockWindows = state.bockWindows || [];
    state.bockWindows.push({fromRoundNo: roundNo+1, toRoundNo: roundNo+4});
  }

  const scaledPerPlayer = result.perPlayer.map(v=>v*bockMultiplier);
  const scaledValue = result.value*bockMultiplier;

  const entry = {
    roundNo,
    label: result.label,
    values: scaledPerPlayer,
    augen: {a:result.augenA, b:result.augenB, sideA:result.sideA, sideB:result.sideB},
    winnerSide: result.winnerSide,
    value: scaledValue,
    baseValue: result.value,
    bockMultiplier,
    isDoppelbock,
    bockTriggeredHere: result.bockTriggered,
    timestamp: Date.now()
  };
  state.scoreHistory.push(entry);
  scaledPerPlayer.forEach((v,i)=> state.totals[i]+=v);
  state.nextVorhand = (round.vorhandIndex+1)%4;
  state.currentRound = null;
  save();
  return {entry, result: {...result, value: scaledValue, perPlayer: scaledPerPlayer, bockMultiplier, isDoppelbock}};
}

/* ============================= NFC-EINGANG ============================= */
let pendingCalibSerial = null;

function processIncomingSerial(serial){
  const cardId = serialToCard(serial);
  if(state.view==='calibrate'){
    pendingCalibSerial = serial;
    render();
    return;
  }
  if(!cardId){
    pendingCalibSerial = serial;
    toast('Unbekannte Karte gescannt — bitte zuordnen.');
    switchView('calibrate');
    return;
  }
  if(!state.currentRound){
    toast('Keine laufende Runde. Bitte zuerst eine Runde starten.');
    switchView('play');
    return;
  }
  const res = addCardToRound(cardId, serial);
  if(!res.ok){ toast(res.msg); }
  state.view = 'play';
  save();
  render();
}

function processBulkFromUrl(serialsRaw){
  if(!state.currentRound){
    toast('Keine laufende Runde — bitte zuerst in "Spiel" eine Runde starten, dann den Kurzbefehl erneut ausführen.');
    switchView('play');
    return;
  }
  const serials = serialsRaw.split(',').map(s=>s.trim()).filter(Boolean);
  const {unresolved, duplicates, rejected} = addBulkSerials(serials);
  state.view = 'play';
  save();
  render();
  const parts = [];
  if(unresolved.length) parts.push(unresolved.length+' unbekannte Karte(n)');
  if(duplicates.length) parts.push(duplicates.length+' doppelt gescannt');
  if(rejected.length) parts.push(rejected.length+' abgelehnt');
  if(parts.length){
    toast(serials.length+' Karten empfangen — '+parts.join(', ')+'.', 5000);
  } else {
    toast(serials.length+' Karten übernommen.');
  }
  if(unresolved.length){
    state.pendingBulkUnresolved = unresolved;
    save();
  }
}

function checkUrlForNfc(){
  const params = new URLSearchParams(window.location.search);
  const bulk = params.get('nfcs');
  const serial = params.get('nfc');
  if(bulk){
    processBulkFromUrl(bulk.trim());
    const url = new URL(window.location.href);
    url.searchParams.delete('nfcs');
    window.history.replaceState({}, '', url.toString());
    return;
  }
  if(serial){
    processIncomingSerial(serial.trim());
    const url = new URL(window.location.href);
    url.searchParams.delete('nfc');
    window.history.replaceState({}, '', url.toString());
  }
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkUrlForNfc(); });
window.addEventListener('pageshow', checkUrlForNfc);

/* ============================= RENDER: SPIEL ============================= */
function renderPlay(){
  const r = state.currentRound;
  if(!r) return renderRoundSetup();
  if(r.awaitingAnnouncements) return renderRoundFinish(r);
  const {teamOf} = resolveTeams(r);
  const isSoloLike = r.type==='solo' || (r.type==='hochzeit' && r.hochzeitPartnerIndex==null) || (r.type==='armut' && (r.armutNiemandAufgenommen || r.armutPartnerIndex==null));

  const trickSlots = [0,1,2,3].map(slot=>{
    const playerIndex = (r.trickLeader+slot)%4;
    const played = r.currentTrick.find(c=>c.playerIndex===playerIndex);
    const isLeader = slot===0;
    return `<div class="trick-slot ${isLeader?'leader':''}">
      ${cardChip(played?played.cardId:null)}
      <div class="name">${state.players[playerIndex]}</div>
    </div>`;
  }).join('');

  const remaining = remainingCardCounts(r);
  const remainingList = ALL_CARD_IDS.filter(id=>remaining[id]>0);

  const augenSoFar = r.completedTricks.reduce((acc,t)=>{
    const side = teamOf[t.winnerIndex];
    acc[side] = (acc[side]||0)+t.augen;
    return acc;
  },{});

  const sideNames = isSoloLike ? ['Solo','Gegner'] : ['Re','Kontra'];

  const lastTrick = r.completedTricks[r.completedTricks.length-1];

  return `
  <div class="card">
    <div class="row" style="align-items:center; justify-content:space-between;">
      <div>
        <span class="pill pill-gold">${roundTypeLabel(r)}</span>
      </div>
      <div class="muted">Stich ${r.trickIndex+1}/12</div>
    </div>
    <div class="trick-row">${trickSlots}</div>
    <div class="muted center">${state.players[r.trickLeader]} führt an.</div>
    ${lastTrick ? `<div class="muted center" style="margin-top:6px;">Letzter Stich: ${state.players[lastTrick.winnerIndex]} (${lastTrick.augen} Augen)</div>`:''}
  </div>

  <div class="card">
    <h3>Augen bisher</h3>
    <div class="row">
      ${sideNames.map(sn=>`<div class="col center"><span class="pill ${sn==='Re'||sn==='Solo'?'pill-re':'pill-kontra'}">${sn}</span><div style="font-size:22px; font-weight:700; margin-top:6px;">${augenSoFar[sn]||0}</div></div>`).join('')}
    </div>
  </div>

  <div class="card">
    <h3>Ansagen</h3>
    <div class="ansage-grid">
      ${ansageBtn(r,'Re-Seite ansagen', sideNames[0], 're')}
      ${ansageBtn(r,'Kontra-Seite ansagen', sideNames[1], 'kontra')}
      ${ansageBtn(r,sideNames[0]+': keine 90', sideNames[0], 'unter90')}
      ${ansageBtn(r,sideNames[1]+': keine 90', sideNames[1], 'unter90')}
      ${ansageBtn(r,sideNames[0]+': keine 60', sideNames[0], 'unter60')}
      ${ansageBtn(r,sideNames[1]+': keine 60', sideNames[1], 'unter60')}
      ${ansageBtn(r,sideNames[0]+': keine 30', sideNames[0], 'unter30')}
      ${ansageBtn(r,sideNames[1]+': keine 30', sideNames[1], 'unter30')}
      ${ansageBtn(r,sideNames[0]+': schwarz', sideNames[0], 'schwarz')}
      ${ansageBtn(r,sideNames[1]+': schwarz', sideNames[1], 'schwarz')}
    </div>
  </div>

  <div class="card">
    <h3>Karte manuell hinzufügen</h3>
    <div class="muted">Falls Scan fehlschlägt oder zum Testen.</div>
    <select id="manualCardSelect">
      <option value="">— Karte wählen —</option>
      ${remainingList.map(id=>`<option value="${id}">${cardLabel(id)} (${remaining[id]}x übrig)</option>`).join('')}
    </select>
    <div class="btn-row">
      <button class="btn-secondary" id="btnAddManualCard">Zur Reihe hinzufügen</button>
      <button class="btn-ghost" id="btnUndo">Rückgängig</button>
    </div>
  </div>

  <div class="card">
    <button class="btn-danger" id="btnAbortRound">Runde abbrechen</button>
  </div>
  `;
}

    <label>Wer sagt Armut an?</label>
    <select id="armutPlayer">${p.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select>
    <label>Wer nimmt die Karten auf?</label>
    <select id="armutPartner">
      ${p.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}
      <option value="none">Niemand — Armut-Spieler spielt allein</option>
    </select>
    <div class="btn-row"><button class="btn-primary" id="btnStartArmut">Armut starten</button></div>
  </div>
  <div class="card">
    <label style="display:flex; align-items:center; gap:8px; text-transform:none; letter-spacing:normal; font-size:14px; color:var(--cream);">
      <input type="checkbox" id="schweinchenCheck" style="width:auto;"> Schweinchen angesagt (Spieler hat beide Karo-Ass)
    </label>
    <div class="muted" style="margin-top:6px;">Kombinierbar mit Normalspiel, Hochzeit oder Armut.</div>
  </div>
  </div>
  `;
}

/* ============================= RENDER: PUNKTE ============================= */
function renderScores(){
  const rows = state.scoreHistory.map(h=>`
    <tr>
      <td>${h.roundNo}${h.bockMultiplier>1?` <span class="pill pill-gold" style="font-size:10px; padding:2px 6px;">${h.isDoppelbock?'⚡⚡×'+h.bockMultiplier:'⚡×'+h.bockMultiplier}</span>`:''}</td>
      <td style="text-align:left;">${h.label}</td>
      ${h.values.map(v=>`<td class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${v}</td>`).join('')}
    </tr>`).join('');

  let roundResultCard = '';
  if(state.lastResult){
    const res = state.lastResult;
    roundResultCard = `
    <div class="card" style="border-color:var(--gold);">
      <h3>Letzte Runde</h3>
      <div class="muted">${res.label} — Gewinner: <b>${res.winnerSide}</b></div>
      <div class="row" style="margin-top:8px;">
        <div class="col center"><span class="pill pill-re">${res.sideA}</span><div style="font-size:20px;font-weight:700;">${res.augenA}</div></div>
        <div class="col center"><span class="pill pill-kontra">${res.sideB}</span><div style="font-size:20px;font-weight:700;">${res.augenB}</div></div>
      </div>
      <hr class="sep">
      <div class="log-item">Grundpunkte (inkl. Schwellen): ${res.basePoints}</div>
      <div class="log-item">Sonderpunkte ${res.sideA}: ${res.sonderA} · ${res.sideB}: ${res.sonderB}</div>
      ${res.fuchsA||res.fuchsB ? `<div class="log-item">Fuchs gefangen — ${res.sideA}: ${res.fuchsA}, ${res.sideB}: ${res.fuchsB}</div>`:''}
      ${res.doppelkopfA||res.doppelkopfB ? `<div class="log-item">Doppelkopf-Stiche — ${res.sideA}: ${res.doppelkopfA}, ${res.sideB}: ${res.doppelkopfB}</div>`:''}
      ${res.karlchen ? `<div class="log-item">Karlchen: ${res.karlchen}</div>`:''}
      <div class="log-item">Ansage-Bonus (erfüllte Schwellen-Ansagen): +${res.escalationBonus}</div>
      <div class="log-item">Ansage-Multiplikator (Re/Kontra angesagt): ×${res.multiplier}</div>
      ${res.bockMultiplier>1 ? `<div class="log-item">${res.isDoppelbock?'Doppelbockrunde':'Bockrunde'}: ×${res.bockMultiplier}</div>`:''}
      <div class="log-item"><b>Punktwert der Runde: ${res.value}</b></div>
      ${res.splitArsch ? `<div class="log-item">120:120 — gespaltener Arsch! Nächste 4 Runden sind Bockrunden.</div>`:''}
      ${res.lostAnnouncement && !res.splitArsch ? `<div class="log-item">Verlorene Ansage — nächste 4 Runden sind Bockrunden.</div>`:''}
    </div>`;
  }

  const activeBockCount = state.settings.bockEnabled ? (state.bockWindows||[]).filter(w=>w.toRoundNo>=state.scoreHistory.length+1).length : 0;

  return `
  ${roundResultCard}
  ${activeBockCount>0 ? `<div class="card" style="border-color:var(--gold);"><div class="center">⚡ ${activeBockCount>1?'Mehrere aktive Bockrunden-Fenster überlappen sich':'Bockrunden-Fenster aktiv'} — nächste Runde(n) zählen doppelt (oder mehr).</div></div>`:''}
  <div class="card">
    <h2>Gesamtstand</h2>
    <table class="score-table">
      <tr>${state.players.map(n=>`<th>${n}</th>`).join('')}</tr>
      <tr>${state.totals.map(t=>`<td style="font-size:20px; font-weight:800;" class="${t>0?'pos':t<0?'neg':''}">${t>0?'+':''}${t}</td>`).join('')}</tr>
    </table>
  </div>
  <div class="card">
    <h2>Rundenverlauf</h2>
    ${state.scoreHistory.length===0 ? '<div class="muted">Noch keine Runde gespielt.</div>' : `
    <table class="score-table">
      <tr><th>#</th><th style="text-align:left;">Spiel</th>${state.players.map(n=>`<th>${n}</th>`).join('')}</tr>
      ${rows}
    </table>`}
  </div>
  `;
}

/* ============================= RENDER: EINSTELLUNGEN ============================= */
function renderSettings(){
  const s = state.settings;
  return `
  <div class="card">
    <h2>Bildschirm wach halten</h2>
    <div class="muted">Verhindert, dass das Display während des Spiels automatisch abschaltet (Standby). Wird auch über das ☀︎-Symbol oben rechts ein-/ausgeschaltet.</div>
    <div class="btn-row">
      <button class="${state.wakeLockEnabled?'btn-primary':'btn-secondary'}" id="btnWakeLockSettings">${state.wakeLockEnabled?'Aktiv — antippen zum Ausschalten':'Inaktiv — antippen zum Einschalten'}</button>
    </div>
    ${!wakeLockSupported ? '<div class="muted" style="margin-top:8px; color:#f3b8b8;">Dieser Browser unterstützt die Funktion nicht — bitte sicherstellen, dass die Seite als Home-Bildschirm-App in aktuellem Safari läuft (iOS 16.4+).</div>' : ''}
    <div class="muted" style="margin-top:8px;">Gilt nur, solange die App im Vordergrund geöffnet ist — wechselst du zu einer anderen App oder sperrst manuell mit der Seitentaste, greift das nicht.</div>
  </div>
  <div class="card">
    <h2>Regeln</h2>
    <div class="stack">
      <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:14px; color:var(--cream);">
        <input type="checkbox" id="setFuchs" ${s.fuchsBonus?'checked':''} style="width:auto;"> Fuchs gefangen (+1)
      </label>
      <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:14px; color:var(--cream);">
        <input type="checkbox" id="setKarlchen" ${s.karlchenBonus?'checked':''} style="width:auto;"> Karlchen — letzter Stich mit Kreuz-Bube (+1)
      </label>
      <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:14px; color:var(--cream);">
        <input type="checkbox" id="setDoppelkopf" ${s.doppelkopfBonus?'checked':''} style="width:auto;"> Doppelkopf — Stich mit ≥40 Augen (+1)
      </label>
      <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:14px; color:var(--cream);">
        <input type="checkbox" id="setDulleLastTrick" ${s.dulleLastTrick?'checked':''} style="width:auto;"> 2. Dulle sticht die 1. (im letzten Stich)
      </label>
      <label style="display:flex; align-items:center; gap:8px; text-transform:none; font-size:14px; color:var(--cream);">
        <input type="checkbox" id="setBock" ${s.bockEnabled?'checked':''} style="width:auto;"> Bockrunden (verlorene Re/Kontra-Ansage oder 120:120)
      </label>
      <div>
        <label>Solo-Multiplikator</label>
        <input type="number" id="setSoloMult" value="${s.soloMultiplier}" min="1" max="5">
      </div>
    </div>
  </div>
  <div class="card">
    <h3>So wird gerechnet</h3>
    <div class="muted">
      1 Grundpunkt fürs Gewinnen (Kontra gewinnt bei 120:120). +1 je unterschrittener Schwelle des Verlierers (unter 90/60/30/0 Augen).
      Sonderpunkte (Fuchs, Karlchen, Doppelkopf) zählen für die Seite, die sie erspielt hat. Erfüllte Schwellen-Ansagen geben +1 extra.
      Re- und/oder Kontra-Ansage verdoppelt die Rundenpunkte (bei beiden ×4). Solo (und Armut ohne Aufnehmer) zählt ${s.soloMultiplier}-fach.
      Bockrunden: Eine verlorene Re-/Kontra-Ansage oder 120:120 lässt die folgenden 4 Runden doppelt zählen. Trifft eine bereits laufende
      Bockrunde erneut eine dieser Bedingungen, wird nur diese eine Runde zur Doppelbockrunde (×4) — zusätzlich startet ihr eigenes neues
      4-Runden-Fenster. Überlappen sich mehrere Fenster, vervielfachen sie sich weiter (×2 je aktivem Fenster).
      Das ist eine gängige Näherung — wir passen die Regeln gern gemeinsam an eure Tischregeln an.
    </div>
  </div>
  <div class="card">
    <h2>Kurzbefehl-Einrichtung (iPhone)</h2>
    <div class="muted">
      1. Kurzbefehle-App → Automatisierung → Neue Automatisierung → NFC → neues Tag wählen (einmalig irgendeine Karte scannen).<br>
      2. Aktion "NFC-Tag lesen" → Ergebnis in Variable.<br>
      3. Aktion "Text" → <code>${'{deine-url}'}/?nfc=</code> gefolgt von der NFC-Seriennummer-Variable.<br>
      4. Aktion "URL öffnen" mit diesem Text.<br>
      5. "Vor Ausführung fragen" ausschalten, "Sofort ausführen" aktivieren.<br>
      Trag danach die echte URL deiner GitHub-Pages-Seite ein.
    </div>
  </div>
  <div class="card">
    <button class="btn-secondary" id="btnCloseSettings">Schließen</button>
  </div>
  `;
}

/* ============================= HAUPT-RENDER ============================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.showSettings){
    html = renderSettings();
  } else {
    switch(state.view){
      case 'setup': html = renderSetup(); break;
      case 'calibrate': html = renderCalibrate(); break;
      case 'scores': html = renderScores(); break;
      default: html = renderPlay(); break;
    }
  }
  app.innerHTML = html;
  document.querySelectorAll('#tabbar button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===state.view && !state.showSettings);
  });
  const wlBtn = document.getElementById('btnWakeLock');
  if(wlBtn) wlBtn.classList.toggle('active', !!state.wakeLockEnabled);
  attachHandlers();
}

function attachHandlers(){
  // Tabbar
  document.querySelectorAll('#tabbar button').forEach(b=>{
    b.onclick = ()=>{ state.showSettings=false; switchView(b.dataset.view); };
  });
  document.getElementById('btnSettings').onclick = ()=>{ state.showSettings=true; save(); render(); };
  document.getElementById('btnWakeLock').onclick = ()=>{ setWakeLockEnabled(!state.wakeLockEnabled); };

  if(state.showSettings){
    const s = state.settings;
    byId('btnCloseSettings')?.addEventListener('click', ()=>{ state.showSettings=false; save(); render(); });
    byId('btnWakeLockSettings')?.addEventListener('click', ()=>{ setWakeLockEnabled(!state.wakeLockEnabled); });
    byId('setFuchs')?.addEventListener('change', e=>{ s.fuchsBonus=e.target.checked; save(); });
    byId('setKarlchen')?.addEventListener('change', e=>{ s.karlchenBonus=e.target.checked; save(); });
    byId('setDoppelkopf')?.addEventListener('change', e=>{ s.doppelkopfBonus=e.target.checked; save(); });
    byId('setDulleLastTrick')?.addEventListener('change', e=>{ s.dulleLastTrick=e.target.checked; save(); });
    byId('setBock')?.addEventListener('change', e=>{ s.bockEnabled=e.target.checked; save(); });
    byId('setSoloMult')?.addEventListener('change', e=>{ s.soloMultiplier=parseInt(e.target.value)||3; save(); });
    return;
  }

  if(state.view==='setup'){
    document.querySelectorAll('.player-name-input').forEach(inp=>{
      inp.addEventListener('change', e=>{
        state.players[parseInt(e.target.dataset.playerIdx)] = e.target.value || ('Spieler '+(parseInt(e.target.dataset.playerIdx)+1));
        save(); render();
      });
    });
    byId('btnResetScores')?.addEventListener('click', ()=>{
      if(confirm('Punktestand wirklich zurücksetzen?')){
        state.scoreHistory=[]; state.totals=[0,0,0,0]; state.currentRound=null; state.lastResult=null; state.bockWindows=[];
        save(); render();
      }
    });
    byId('btnResetAll')?.addEventListener('click', ()=>{
      if(confirm('Wirklich ALLES zurücksetzen, inklusive Kartenkalibrierung?')){
        state = defaultState(); save(); render();
      }
    });
  }

  if(state.view==='calibrate'){
    byId('btnManualScan')?.addEventListener('click', ()=>{
      const v = byId('manualSerial').value.trim();
      if(v) processIncomingSerial(v);
    });
    byId('btnCalibCancel')?.addEventListener('click', ()=>{ pendingCalibSerial=null; render(); });
    byId('btnCalibSave')?.addEventListener('click', ()=>{
      const val = byId('calibSelect').value;
      if(!val){ toast('Bitte eine Karte auswählen.'); return; }
      assignSerial(pendingCalibSerial, val);
      toast(cardLabel(val)+' zugeordnet.');
      pendingCalibSerial=null;
      render();
    });
  }

  if(state.view==='play'){
    if(!state.currentRound){
      byId('btnStartNormal')?.addEventListener('click', ()=>{
        startNewRound('normal', {schweinchenActive: byId('schweinchenCheck').checked});
        render();
      });
      byId('btnStartHochzeit')?.addEventListener('click', ()=>{
        startNewRound('hochzeit', {hochzeitPlayerIndex: parseInt(byId('hochzeitPlayer').value), schweinchenActive: byId('schweinchenCheck').checked});
        render();
      });
      byId('btnStartSolo')?.addEventListener('click', ()=>{
        startNewRound('solo', {soloPlayerIndex: parseInt(byId('soloPlayer').value), soloArt: byId('soloArt').value, schweinchenActive: byId('schweinchenCheck').checked});
        render();
      });
      byId('btnStartArmut')?.addEventListener('click', ()=>{
        const playerIdx = parseInt(byId('armutPlayer').value);
        const partnerRaw = byId('armutPartner').value;
        const niemand = (partnerRaw==='none');
        if(!niemand && parseInt(partnerRaw)===playerIdx){
          toast('Armut-Spieler und Aufnehmer müssen unterschiedliche Spieler sein.');
          return;
        }
        startNewRound('armut', {
          armutPlayerIndex: playerIdx,
          armutPartnerIndex: niemand ? null : parseInt(partnerRaw),
          armutNiemandAufgenommen: niemand,
          schweinchenActive: byId('schweinchenCheck').checked
        });
        render();
      });
    } else if(state.currentRound.awaitingAnnouncements){
      document.querySelectorAll('.ansage-btn').forEach(b=>{
        b.onclick = ()=>{ addAnnouncement(b.dataset.side, b.dataset.type); render(); };
      });
      byId('btnFinalizeRound')?.addEventListener('click', ()=>{
        state.pendingBulkUnresolved = null;
        const out = finishRound();
        if(out){ state.lastResult = out.result; save(); switchView('scores'); }
      });
      byId('btnUndoFromFinish')?.addEventListener('click', ()=>{
        state.currentRound.awaitingAnnouncements = false;
        undoLastAction();
        render();
      });
    } else {
      document.querySelectorAll('.ansage-btn').forEach(b=>{
        b.onclick = ()=>{ addAnnouncement(b.dataset.side, b.dataset.type); render(); };
      });
      byId('btnAddManualCard')?.addEventListener('click', ()=>{
        const v = byId('manualCardSelect').value;
        if(!v){ toast('Bitte eine Karte wählen.'); return; }
        const res = addCardToRound(v, 'manual-'+v+'-'+Date.now());
        if(!res.ok) toast(res.msg);
        render();
      });
      byId('btnUndo')?.addEventListener('click', ()=>{ undoLastAction(); render(); });
      byId('btnAbortRound')?.addEventListener('click', ()=>{
        if(confirm('Laufende Runde wirklich abbrechen? Es werden keine Punkte vergeben.')){
          state.currentRound=null; save(); render();
        }
      });
    }
  }
}

function byId(id){ return document.getElementById(id); }

/* ============================= INIT ============================= */
checkUrlForNfc();
render();
if(state.wakeLockEnabled) acquireWakeLock();
</script>
</body>
</html>
